# Tests on every push / pull request, in Blender 5.3 (the only supported version).
# Pushing a tag vX.Y.Z additionally builds the extension and publishes a GitHub
# release with the zip attached, using the annotated tag's message as notes.
name: Tests

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  BLENDER_VERSION: "5.3.0"
  BLENDER_SERIES: "5.3"
  # sha256 of blender-5.3.0-linux-x64.tar.xz, from download.blender.org/release/Blender5.3/blender-5.3.0.sha256
  BLENDER_SHA256: "dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender (retries + official mirrors, checksum verified)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          file="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          ok=""
          for base in \
            "https://download.blender.org/release" \
            "https://mirrors.ocf.berkeley.edu/blender/release" \
            "https://ftp.nluug.nl/pub/graphics/blender/release" \
            "https://mirror.clarkson.edu/blender/release"; do
            url="$base/Blender${BLENDER_SERIES}/$file"
            echo "Trying $url"
            if curl -fL --retry 4 --retry-delay 10 --retry-all-errors --connect-timeout 30 -o "$file" "$url" \
               && echo "${BLENDER_SHA256}  $file" | sha256sum -c -; then
              ok=1; break
            fi
            rm -f "$file"
          done
          [ -n "$ok" ] || { echo "Blender download failed on every mirror"; exit 1; }
          mkdir -p ~/blender
          tar -xJf "$file" -C ~/blender --strip-components=1

      - name: System libraries for headless Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6

      - name: Unit tests
        run: python3 tests/run_blender.py --blender ~/blender/blender

      - name: Validate and build the extension
        run: |
          ~/blender/blender --factory-startup --command extension validate driver_controllers
          mkdir -p dist
          ~/blender/blender --factory-startup --command extension build --source-dir driver_controllers --output-dir dist

      - name: Install test (built zip, isolated profile)
        run: python3 tests/run_blender.py --blender ~/blender/blender tests/test_install.py -- dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the tag object (checkout only brings the commit)
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Tag must match the manifest version
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' driver_controllers/blender_manifest.toml)
          [ "v$manifest" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != manifest v$manifest"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Driver Controllers $GITHUB_REF_NAME" --notes-file notes.md
